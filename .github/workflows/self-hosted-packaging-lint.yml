# Adapted from storytold/craft-common-actions at fd14193f062cd71f9de9426bd450aa0adad670f0.
name: "Packaging lint"

on:
  workflow_call:
    inputs:
      actionlint-version:
        description: "Version of actionlint to install"
        type: string
        required: false
        default: "1.7.12"
      extra-checks-script:
        description: "Optional repository-local Bash script for app-specific packaging checks"
        type: string
        required: false
        default: ""

jobs:
  lint:
    if: ${{ github.repository_owner == 'mamankub' && github.actor == 'mamankub' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ["self-hosted", "Linux", "X64", "asd-ci", "ubuntu-24.04"]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run packaging lint
        uses: storytold/craft-common-actions/actions/packaging-lint@fd14193f062cd71f9de9426bd450aa0adad670f0
        with:
          actionlint-version: ${{ inputs.actionlint-version }}
      - name: App-specific packaging checks
        if: inputs.extra-checks-script != ''
        env:
          CHECKS_SCRIPT: ${{ inputs.extra-checks-script }}
        run: bash -- "$CHECKS_SCRIPT"
